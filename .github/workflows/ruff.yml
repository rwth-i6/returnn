name: ruff

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  check-ruff-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.8
          cache: 'pip'
          cache-dependency-path: '.github/workflows/ruff.yml'
      - run: pip install ruff==0.11.8
      - run: ruff format --diff .
      # lint: curated always-clean subset
      # (a full `ruff check` still has legacy findings: F401/F403 re-exports + star imports, E741, ...)
      - run: ruff check --select F541,F632,E713,E721 .
