name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  pycharm-inspect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The inspection should see the versions we develop against, so this job runs modern packages,
        # unlike the test jobs, which deliberately also cover old ones.
        # ESPnet is the odd one out: it pins numpy<1.24, which no modern TF or JAX accepts,
        # so it is installed without its dependencies here (--espnet-no-deps).
        python-version:
          - "3.12"
        torch-version:
          # Some code uses newer features.
          - 2.8.0
        tf-version:
          - 2.21.0
        jax-version:
          - 0.11.0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            ~/.local
          key: cache-${{ runner.os }}-py${{ matrix.python-version }}-torch${{ matrix.torch-version }}-tf${{ matrix.tf-version }}-jax${{ matrix.jax-version }}
          restore-keys: |
            cache-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Setup dependencies
        run: |
          echo "PATH=$PATH:~/.local/bin" >> $GITHUB_ENV
          echo "Python ${{matrix.python-version}}"
          python .github/workflows/_setup_deps.py \
            --python ${{matrix.python-version}} \
            --torch ${{ matrix.torch-version }} \
            --tf ${{ matrix.tf-version }} \
            --jax ${{ matrix.jax-version }} \
            --espnet 1 \
            --espnet-no-deps 1 \
            --hf-datasets 1

      - name: Cache PyCharm
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains
          key: cache-pycharm-${{ runner.os }}-py${{ matrix.python-version }}-torch${{ matrix.torch-version }}-tf${{ matrix.tf-version }}

      - name: Run PyCharm inspect
        run: |
          tests/pycharm-inspect.py --install_py_deps

  base-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - 3.8
        action:
          - TEST=Dataset
          - TEST=fork_exec
          - TEST=GeneratingDataset
          - TEST=hdf_dump
          - TEST=HDFDataset
          - TEST=LearningRateControl
          - TEST=MultiProcDataset
          - TEST=Pretrain
          - TEST=SprintDataset
          - TEST=TaskSystem
          - TEST=TaskSystem_SharedMem
          - TEST=tensor
          - TEST=TranslationDataset
          - TEST=Util

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            ~/.local
          key: cache-${{ runner.os }}-py${{ matrix.python-version }}-no-tf
          restore-keys: |
            cache-${{ runner.os }}-py${{ matrix.python-version }}-no-tf

      - name: Setup dependencies
        run: |
          echo "PATH=$PATH:~/.local/bin" >> $GITHUB_ENV
          echo "Python ${{matrix.python-version}}"

          python .github/workflows/_setup_deps.py \
            --python ${{matrix.python-version}}

      - name: Run test
        run: |
          export ${{ matrix.action }}
          python -m pytest tests/test_$TEST.py

  # Needs newer Python. Also install the extra datasets dependency only here.
  hf-datasets-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
        torch-version:
          - 2.8.0
        action:
          - TEST=datasets_huggingface

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            ~/.local
          key: cache-${{ runner.os }}-py${{ matrix.python-version }}-torch${{ matrix.torch-version }}
          restore-keys: |
            cache-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Setup dependencies
        run: |
          echo "PATH=$PATH:~/.local/bin" >> $GITHUB_ENV
          echo "Python ${{matrix.python-version}}"
          python .github/workflows/_setup_deps.py \
            --python ${{matrix.python-version}} \
            --torch ${{ matrix.torch-version }} \
            --hf-datasets 1

      - name: Run test
        run: |
          export ${{ matrix.action }}
          python -m pytest tests/test_$TEST.py

  tf-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - 3.8
        tf-version:
          - 2.10.0
        action:
          - TEST=Config
          - TEST=Fsa
          - TEST=Log
          - TEST=SprintInterface
          - TEST=TFEngine
          - TEST=TFNativeOp
          - TEST=TFNetworkLayer
          - TEST=TFNetworkRecLayer
          - TEST=TFUpdater
          - TEST=TFUtil
          - TEST=tools
        include:
          - action: TEST=TFEngine
            python-version: 3.8
            tf-version: 2.3.0
          - action: TEST=demos RETURNN_DISABLE_TORCH=1
            python-version: 3.8
            tf-version: 2.3.0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            ~/.local
          key: cache-${{ runner.os }}-py${{ matrix.python-version }}-tf${{ matrix.tf-version }}
          restore-keys: |
            cache-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Setup dependencies
        run: |
          echo "PATH=$PATH:~/.local/bin" >> $GITHUB_ENV
          echo "Python ${{matrix.python-version}}"

          python .github/workflows/_setup_deps.py \
            --python ${{matrix.python-version}} \
            --tf ${{ matrix.tf-version }}

      - name: Run test
        run: |
          export ${{ matrix.action }}
          python -m pytest tests/test_$TEST.py

  torch-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
        torch-version:
          - 1.13.1
          - 2.0.0
        action:
          - TEST=demos RETURNN_DISABLE_TF=1
          - TEST=torch_dataset
          - TEST=torch_engine
          - TEST=torch_frontend
          - TEST=torch_internal_frontend
          - TEST=torch_util
          - TEST=torch_native_op
          - TEST=threading

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            ~/.local
          key: cache-${{ runner.os }}-py${{ matrix.python-version }}-torch${{ matrix.torch-version }}
          restore-keys: |
            cache-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Setup dependencies
        run: |
          echo "PATH=$PATH:~/.local/bin" >> $GITHUB_ENV
          echo "Python ${{matrix.python-version}}"

          python .github/workflows/_setup_deps.py \
            --python ${{matrix.python-version}} \
            --torch ${{ matrix.torch-version }}

      - name: Run test
        run: |
          export ${{ matrix.action }}
          python -m pytest tests/test_$TEST.py

  # Own job, not part of rf-tests: JAX needs Python >=3.12 and NumPy >=2.1,
  # while rf-tests runs Python 3.10 and pins NumPy <2 (1.23.5 with ESPnet).
  # Torch is installed because the tests compare the JAX backend against it in the same process.
  rf-jax-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
        torch-version:
          - 2.7.1
        jax-version:
          - 0.11.0
        action:
          - TEST=rf_jax

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            ~/.local
          key: cache-${{ runner.os }}-py${{ matrix.python-version }}-torch${{ matrix.torch-version }}-jax${{ matrix.jax-version }}
          restore-keys: |
            cache-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Setup dependencies
        run: |
          echo "PATH=$PATH:~/.local/bin" >> $GITHUB_ENV
          echo "Python ${{matrix.python-version}}"

          python .github/workflows/_setup_deps.py \
            --python ${{matrix.python-version}} \
            --torch ${{ matrix.torch-version }} \
            --jax ${{ matrix.jax-version }}

      - name: Run test
        run: |
          export ${{ matrix.action }}
          python -m pytest tests/test_$TEST.py

  rf-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
        torch-version:
          - 2.0.0
        tf-version:
          - 2.10.0
        action:
          - TEST=rf_array
          - TEST=rf_attention
          - TEST=rf_base
          - TEST=rf_cond
          - TEST=rf_const
          - TEST=rf_container
          - TEST=rf_conv
          - TEST=rf_decoder_transformer
          - TEST=rf_encoder_conformer
          - TEST=rf_gradient
          - TEST=rf_label_smoothing
          - TEST=rf_loop
          - TEST=rf_math
          - TEST=rf_normalization
          - TEST=rf_packed
          - TEST=rf_piecewise_linear
          - TEST=rf_rec
          - TEST=rf_reduce
          - TEST=rf_signal
          - TEST=rf_tf_backend
        include:
          # Some selected tests (but not all) with some other versions.
          - action: TEST=rf_base
            python-version: 3.8
            torch-version: 1.13.1
            tf-version: 2.10.0
          # rf_packed: the flex fast paths and the traced-replay test need a recent torch
          - action: TEST=rf_packed
            python-version: "3.10"
            torch-version: 2.7.1
            tf-version: 2.10.0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            ~/.local
          key: cache-${{ runner.os }}-py${{ matrix.python-version }}-torch${{ matrix.torch-version }}-tf${{ matrix.tf-version }}
          restore-keys: |
            cache-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Setup dependencies
        run: |
          echo "PATH=$PATH:~/.local/bin" >> $GITHUB_ENV
          echo "Python ${{matrix.python-version}}"

          python .github/workflows/_setup_deps.py \
            --python ${{matrix.python-version}} \
            --torch ${{ matrix.torch-version }} \
            --tf ${{ matrix.tf-version }} \
            --espnet 1

      - name: Run test
        run: |
          export ${{ matrix.action }}
          python -m pytest tests/test_$TEST.py
